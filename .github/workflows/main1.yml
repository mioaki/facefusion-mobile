  build-apk:
    needs: patch          # only if you keep the patch job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (patched branch)
        uses: actions/checkout@v4
        with:
          ref: disable-nsfw-gate   # or the branch that contains the patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        working-directory: work/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: facefusion-mobile-release
          path: work/android/app/build/outputs/apk/release/*.apk
