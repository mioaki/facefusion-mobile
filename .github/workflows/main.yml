name: Disable NSFW Content Gate

on:
  workflow_dispatch:   # Run manually from the Actions tab

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch ContentGate.kt
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          file = Path("work/android/app/src/main/java/com/facefusion/mobile/ContentGate.kt")
          content = file.read_text()

          # 1. Add ENABLED constant right after "object ContentGate {"
          if "const val ENABLED" not in content:
              content = content.replace(
                  "object ContentGate {",
                  "object ContentGate {\n\n    const val ENABLED = false",
                  1
              )

          # 2. Add bypassResult() helper (after the Result data class)
          bypass = '''
      private fun bypassResult() = Result(
          verdict = Verdict.ALLOW,
          score = 0f,
          sampled = 0,
          flagged = 0,
          detail = "content gate disabled"
      )
          '''
          if "fun bypassResult" not in content:
              # Insert after the closing brace of the Result data class
              content = re.sub(
                  r'(data class Result\([\s\S]*?\n    \})',
                  r'\1\n' + bypass,
                  content,
                  count=1
              )

          # 3. Early return at the start of checkImage
          if "if (!ENABLED) return bypassResult()" not in content:
              content = re.sub(
                  r'(fun checkImage\(bitmap: Bitmap\): Result \{\n)',
                  r'\1        if (!ENABLED) return bypassResult()\n\n',
                  content,
                  count=1
              )

          # 4. Replace checkVideo
          content = re.sub(
              r'fun checkVideo\(file: File\): Result\s*=\s*sampleByRetriever\(file\) \?: sampleByDecoder\(file\)',
              '''fun checkVideo(file: File): Result {
          if (!ENABLED) return bypassResult()

          return sampleByRetriever(file) ?: sampleByDecoder(file)
      }''',
              content,
              count=1
          )

          file.write_text(content)
          print("Patch applied successfully")
          PY

      - name: Verify the patch
        run: |
          echo "===== ENABLED + bypassResult ====="
          grep -n -A 8 -E 'ENABLED|bypassResult' \
            work/android/app/src/main/java/com/facefusion/mobile/ContentGate.kt || true
          echo
          echo "===== checkImage ====="
          grep -n -A 6 'fun checkImage' \
            work/android/app/src/main/java/com/facefusion/mobile/ContentGate.kt
          echo
          echo "===== checkVideo ====="
          grep -n -A 6 'fun checkVideo' \
            work/android/app/src/main/java/com/facefusion/mobile/ContentGate.kt

      - name: Upload patched file
        uses: actions/upload-artifact@v4
        with:
          name: ContentGate-patched
          path: work/android/app/src/main/java/com/facefusion/mobile/ContentGate.kt

      # Optional – commit to a new branch
      - name: Commit & push patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b disable-nsfw-gate || git checkout disable-nsfw-gate
          git add work/android/app/src/main/java/com/facefusion/mobile/ContentGate.kt
          git commit -m "Disable NSFW content gate (ENABLED = false)" || echo "No changes to commit"
          git push origin disable-nsfw-gate --force
